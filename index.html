<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚚 Калькулятор доставки по Краснодару</title>
<style>
/* === ОСНОВНЫЕ СТИЛИ === */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f8f9fa;
  color: #2c3e50;
  min-height: 100vh;
}
.container {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px;
}
h1 {
  text-align: center;
  font-size: 1.5rem;
  color: #2c3e50;
  margin-bottom: 24px;
  padding-top: 12px;
}

/* === ФОРМА === */
.form-group {
  margin-bottom: 16px;
  position: relative;
}
label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  font-size: 0.9rem;
  color: #2c3e50;
}
input[type="text"],
input[type="number"],
select {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 1rem;
  transition: border-color 0.3s;
  background: #fff;
  color: #2c3e50;
}
input:focus, select:focus {
  outline: none;
  border-color: #ff4747;
}

/* === АВТОПОДСКАЗКИ === */
.autocomplete-list {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #fff;
  border: 2px solid #ddd;
  border-top: none;
  border-radius: 0 0 10px 10px;
  max-height: 220px;
  overflow-y: auto;
  z-index: 100;
  display: none;
}
.autocomplete-item {
  padding: 10px 14px;
  cursor: pointer;
  font-size: 0.9rem;
  border-bottom: 1px solid #f0f0f0;
  transition: background 0.15s;
}
.autocomplete-item:hover {
  background: #fff0f0;
}
.autocomplete-item:last-child { border-bottom: none; }

/* === КНОПКИ === */
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  margin-bottom: 10px;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: #ff4747;
  color: #fff;
  box-shadow: 0 4px 14px rgba(255, 71, 71, 0.35);
}
.btn-primary:hover { box-shadow: 0 6px 20px rgba(255, 71, 71, 0.5); }
.btn-secondary {
  background: #2c3e50;
  color: #fff;
}
.btn-outline {
  background: transparent;
  color: #2c3e50;
  border: 2px solid #ddd;
}
.btn-outline:hover { border-color: #2c3e50; }
.btn-sm {
  padding: 10px 16px;
  font-size: 0.85rem;
  width: auto;
}
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 6px;
}
.btn-row .btn { flex: 1; }

/* === КАРТОЧКА РЕЗУЛЬТАТА === */
.result-card {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  margin-top: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.1);
  animation: slideUp 0.4s ease;
  display: none;
}
.result-card.show { display: block; }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.result-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 0.95rem;
  border-bottom: 1px solid #f0f0f0;
}
.result-row:last-child { border-bottom: none; }
.result-row.total {
  font-size: 1.2rem;
  font-weight: 700;
  color: #ff4747;
  border-top: 2px solid #ff4747;
  margin-top: 6px;
  padding-top: 12px;
}
.result-label { color: #666; }

/* === МОДАЛЬНОЕ ОКНО === */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
  overflow-y: auto;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  width: 100%;
  max-width: 560px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  margin-top: 30px;
}
.modal h2 {
  font-size: 1.2rem;
  margin-bottom: 14px;
  text-align: center;
}
.modal-search {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 0.9rem;
  margin-bottom: 14px;
}
.modal-search:focus { outline: none; border-color: #ff4747; }
.modal-table-wrap {
  flex: 1;
  overflow-y: auto;
  margin-bottom: 14px;
  border: 1px solid #eee;
  border-radius: 10px;
}
.zone-group-header {
  padding: 8px 12px;
  font-weight: 700;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  position: sticky;
  top: 0;
  z-index: 2;
}
/* Цветовое кодирование групп */
.group-central { background: #ffe5e5; color: #c0392b; }
.group-west { background: #e5ecff; color: #2980b9; }
.group-prikuban { background: #e5ffe5; color: #27ae60; }
.group-karasun { background: #fff3e0; color: #e67e22; }
.group-stanitsy { background: #f3e5ff; color: #8e44ad; }
.group-hutora { background: #f0e0d0; color: #795548; }
.group-poselki { background: #eceff1; color: #607d8b; }
.group-other { background: #e0f7fa; color: #00838f; }

.zone-row {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  border-bottom: 1px solid #f5f5f5;

.zone-row:last-child { border-bottom: none; }
.zone-name {

  font-size: 0.85rem;
  padding-right: 10px;

.zone-price-input {

  padding: 6px 8px;

  border-radius: 6px;
  font-size: 0.85rem;
  text-align: right;

.zone-price-input:focus { outline: none; border-color: #ff4747; }
.modal-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;

.modal-actions .btn { flex: 1; min-width: 120px; }

/* === ЗАГРУЗКА === */
.spinner {
  display: none;
  text-align: center;
  padding: 20px;
  color: #999;

.spinner.show { display: block; }
.error-msg {
  background: #fff0f0;
  color: #c0392b;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  margin-top: 12px;
  display: none;
  font-size: 0.9rem;

.error-msg.show { display: block; }

<body>

<div class="container">
  <!-- Заголовок -->
  <h1>🚚 Калькулятор доставки по Краснодару</h1>

  <!-- Адрес с автоподсказками -->
  <div class="form-group">
    <label for="addressInput">📍 Адрес (улица и дом)</label>
    <input type="text" id="addressInput" placeholder="Например: Красная 1" autocomplete="off">
    <div class="autocomplete-list" id="autocompleteList"></div>
  </div>

  <!-- Тип подъёма -->
  <div class="form-group">
    <label for="liftType">🛗 Тип подъёма</label>
    <select id="liftType">
      <option value="lift">Лифт</option>
      <option value="nolift">Без лифта</option>
      <option value="owner">С хозяином</option>
    </select>
  </div>

  <!-- Этаж -->
  <div class="form-group">
    <label for="floorInput">🏢 Этаж</label>
    <input type="number" id="floorInput" min="1" max="50" value="1">
  </div>

  <!-- Кнопки -->
  <button class="btn btn-primary" id="calcBtn" onclick="calculate()">Рассчитать</button>

  <!-- Загрузка -->
  <div class="spinner" id="spinner">⏳ Определяем адрес...</div>

  <!-- Ошибка -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Карточка результата -->
  <div class="result-card" id="resultCard">
    <div class="result-row">
      <span class="result-label">📍 Адрес:</span>
      <span id="resAddress" style="text-align:right;max-width:60%;font-weight:600;"></span>
    </div>
    <div class="result-row">
      <span class="result-label">📍 Район:</span>
      <span id="resZone" style="font-weight:600;"></span>
    </div>
    <div class="result-row">
      <span class="result-label">🚚 Доставка:</span>
      <span id="resDelivery" style="font-weight:600;"></span>
    </div>
    <div class="result-row">
      <span class="result-label">🛗 Подъём:</span>
      <span id="resLift" style="font-weight:600;"></span>
    </div>
    <div class="result-row total">
      <span>💰 ИТОГО:</span>
      <span id="resTotal"></span>
    </div>
  </div>

  <!-- Кнопки снизу -->
  <div class="btn-row" style="margin-top:16px;">
    <button class="btn btn-outline" onclick="resetAll()">Сброс</button>
    <button class="btn btn-secondary" onclick="openModal()">⚙️ Управление ценами</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">

    <h2>⚙️ Управление ценами доставки</h2>

    <div class="modal-table-wrap" id="zoneTableWrap"></div>
    <div class="modal-actions">
      <button class="btn btn-primary btn-sm" onclick="savePrices()">💾 Сохранить все</button>

let zones = ZONES_DATA.map(z => ({
  ...z,
  price: DEFAULT_PRICE
}));

function loadPrices() {
  // Загружаем цены из localStorage
  const saved = localStorage.getItem('krd_delivery_prices');
  if (saved) {
    try {
      const prices = JSON.parse(saved);
      zones.forEach(z => {
        if (prices[z.id] !== undefined) {
          z.price = Number(prices[z.id]);
        }
      });
    } catch(e) {
      console.warn('Ошибка загрузки цен:', e);
    }
  }
}

function savePricesToStorage() {
  // Сохраняем цены в localStorage
  const prices = {};
  zones.forEach(z => { prices[z.id] = z.price; });
  localStorage.setItem('krd_delivery_prices', JSON.stringify(prices));
}

loadPrices();

// ============================================================
// АЛГОРИТМ RAY CASTING — проверка точки в полигоне
// ============================================================
function pointInPolygon(lat, lng, polygon) {
  let inside = false;
  const n = polygon.length;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const yi = polygon[i][0], xi = polygon[i][1];
    const yj = polygon[j][0], xj = polygon[j][1];
    if (((yi > lat) !== (yj > lat)) &&
        (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

// Определение зоны по координатам
function findZone(lat, lng) {
  for (const zone of zones) {
    if (pointInPolygon(lat, lng, zone.coords)) {
      return zone;
    }
  }
  return null;
}

// ЯНДЕКС.ГЕОКОДЕР API: геокодирование и автоподсказки
// ============================================================
const YANDEX_API_KEY = '78878ee3-2be9-4cfd-b99d-8b9e78b387f1';
const YANDEX_GEOCODER_URL = 'https://geocode-maps.yandex.ru/1.x/';
const REQUEST_TIMEOUT = 5000; // Таймаут запроса 5 секунд
const DEBOUNCE_DELAY = 500; // Задержка перед запросом автоподсказок

let debounceTimer = null;
let selectedLat = null;
let selectedLng = null;
let selectedDisplayName = '';

const addressInput = document.getElementById('addressInput');
const autocompleteList = document.getElementById('autocompleteList');

// Функция для создания URL запроса к Яндекс.Геокодеру
function buildYandexUrl(query, results = 5) {
  const params = new URLSearchParams({
    apikey: YANDEX_API_KEY,
    geocode: query,
    format: 'json',
    results: results,
    lang: 'ru_RU'
  });
  return `${YANDEX_GEOCODER_URL}?${params.toString()}`;
}

// Функция fetch с таймаутом
async function fetchWithTimeout(url, timeout = REQUEST_TIMEOUT) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeout);
  
  try {
    const response = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    return response;
  } catch (error) {
    clearTimeout(timeoutId);
    if (error.name === 'AbortError') {
      throw new Error('TIMEOUT');
    }
    throw error;
  }
}

// Парсинг ответа Яндекс.Геокодера — извлечение списка адресов
function parseYandexResponse(data) {
  const results = [];
  try {
    const featureMembers = data.response.GeoObjectCollection.featureMember;
    if (!featureMembers || featureMembers.length === 0) {
      return results;
    }
    featureMembers.forEach(item => {
      const geoObject = item.GeoObject;
      const text = geoObject.metaDataProperty.GeocoderMetaData.text;
      // Координаты в формате "lon lat" — нужно разделить и поменять местами
      const pos = geoObject.Point.pos.split(' ');
      const lon = parseFloat(pos[0]);
      const lat = parseFloat(pos[1]);
      results.push({ text, lat, lon });
    });
  } catch (e) {
    console.error('Ошибка парсинга ответа Яндекса:', e);
  }
  return results;
}

// Автоподсказки при вводе адреса
addressInput.addEventListener('input', function() {
  selectedLat = null;
  selectedLng = null;
  const query = this.value.trim();
  if (query.length < 3) {
    autocompleteList.style.display = 'none';
    return;
  }
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => fetchSuggestions(query), DEBOUNCE_DELAY);
});

// Скрытие подсказок при клике вне
document.addEventListener('click', function(e) {
  if (!addressInput.contains(e.target) && !autocompleteList.contains(e.target)) {
    autocompleteList.style.display = 'none';
  }
});

async function fetchSuggestions(query) {
  // Добавляем "Краснодар" для более точного поиска
  const fullQuery = 'Краснодар, ' + query;
  const url = buildYandexUrl(fullQuery, 5);

  try {
    const resp = await fetchWithTimeout(url);
    
    if (!resp.ok) {
      throw new Error('HTTP_ERROR');
    }
    
    const data = await resp.json();
    const results = parseYandexResponse(data);
    showSuggestions(results);
  } catch(e) {
    console.error('Ошибка запроса к Яндекс.Геокодеру:', e);
    // Не показываем ошибку пользователю при автоподсказках — просто скрываем список
    autocompleteList.style.display = 'none';
  }
}

function showSuggestions(results) {
  autocompleteList.innerHTML = '';
  if (!results || results.length === 0) {
    autocompleteList.style.display = 'none';
    return;
  }
  results.forEach(r => {
    const item = document.createElement('div');
    item.className = 'autocomplete-item';
    item.textContent = r.text;
    item.addEventListener('click', () => {
      addressInput.value = r.text;
      // Яндекс возвращает lon, lat — для ray casting используем lat, lon
      selectedLat = r.lat;
      selectedLng = r.lon;
      selectedDisplayName = r.text;
      autocompleteList.style.display = 'none';
    });
    autocompleteList.appendChild(item);
  });
  autocompleteList.style.display = 'block';
}

// РАСЧЁТ СТОИМОСТИ ПОДЪЁМА
// ============================================================
function calcLiftPrice(type, floor) {
  floor = Math.max(1, Math.min(50, floor));
  if (type === 'lift') {
    // Лифт: 600₽ на любой этаж
    return 600;
  } else if (type === 'nolift') {
    // Без лифта: 1 эт = 600, 2 эт = 1200, 3+ = 1200 + 250 × (этаж − 2)
    if (floor === 1) return 600;
    if (floor === 2) return 1200;
    return 1200 + 250 * (floor - 2);
  } else if (type === 'owner') {
    // С хозяином: 1 эт = 600, 2+ = 600 + 175 × (этаж − 1)
    if (floor === 1) return 600;
    return 600 + 175 * (floor - 1);
  }
  return 0;
}

// ============================================================
// ОСНОВНОЙ РАСЧЁТ
// ============================================================
async function calculate() {
  const errorMsg = document.getElementById('errorMsg');
  const spinner = document.getElementById('spinner');
  const resultCard = document.getElementById('resultCard');

  errorMsg.classList.remove('show');
  errorMsg.textContent = '';
  resultCard.classList.remove('show');

  const query = addressInput.value.trim();
  if (!query) {
    showError('Введите адрес для расчёта');
    return;
  }

  let lat = selectedLat;
  let lng = selectedLng;

  // Если координаты не выбраны из подсказок, делаем геокодирование
  if (lat === null || lng === null) {
    spinner.classList.add('show');
    try {
      // Добавляем "Краснодар" если не указан в запросе
      const fullQuery = query.toLowerCase().includes('краснод') 
        ? query 
        : 'Краснодар, ' + query;
      const url = buildYandexUrl(fullQuery, 1);
      
      const resp = await fetchWithTimeout(url);
      
      if (!resp.ok) {
        throw new Error('HTTP_ERROR');
      }
      
      const data = await resp.json();
      const results = parseYandexResponse(data);
      spinner.classList.remove('show');

      if (!results || results.length === 0) {
        showError('Адрес не найден. Попробуйте уточнить.');
        return;
      }
      
      // Яндекс возвращает lon, lat — для ray casting используем lat, lon
      lat = results[0].lat;
      lng = results[0].lon;
      selectedDisplayName = results[0].text;
    } catch(e) {
      spinner.classList.remove('show');
      // Разные сообщения в зависимости от типа ошибки
      if (e.message === 'TIMEOUT') {
        showError('Сервис временно недоступен. Попробуйте позже.');
      } else if (e.name === 'TypeError' || e.message === 'Failed to fetch') {
        showError('Проверьте интернет-соединение.');
      } else {
        showError('Сервис временно недоступен. Попробуйте позже.');
      }
      console.error('Ошибка геокодирования:', e);
      return;
    }
  }

  spinner.classList.remove('show');

  // Определяем зону по координатам
  const zone = findZone(lat, lng);
  if (!zone) {
    showError(`Координаты (${lat.toFixed(4)}, ${lng.toFixed(4)}) не попали ни в одну зону доставки. Возможно, адрес за пределами обслуживаемой территории.`);
    return;
  }

  // Расчёт подъёма
  const liftType = document.getElementById('liftType').value;
  const floor = parseInt(document.getElementById('floorInput').value) || 1;
  const deliveryPrice = zone.price;
  const liftPrice = calcLiftPrice(liftType, floor);
  const total = deliveryPrice + liftPrice;

  // Отображение результата
  const shortAddr = selectedDisplayName || query;
  document.getElementById('resAddress').textContent = shortAddr.length > 60
    ? shortAddr.substring(0, 57) + '...'
    : shortAddr;
  document.getElementById('resZone').textContent = zone.name;
  document.getElementById('resDelivery').textContent = deliveryPrice + '₽';
  document.getElementById('resLift').textContent = liftPrice + '₽';
  document.getElementById('resTotal').textContent = total + '₽';

  resultCard.classList.add('show');
}

function showError(msg) {
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = msg;
  errorMsg.classList.add('show');
}

// ============================================================
// СБРОС
// ============================================================
function resetAll() {
  addressInput.value = '';
  document.getElementById('liftType').value = 'lift';
  document.getElementById('floorInput').value = 1;
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('spinner').classList.remove('show');
  autocompleteList.style.display = 'none';
  selectedLat = null;
  selectedLng = null;
  selectedDisplayName = '';
}

// ============================================================
// МОДАЛЬНОЕ ОКНО УПРАВЛЕНИЯ ЦЕНАМИ
// ============================================================
function openModal() {
  renderZoneTable();
  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

// Закрытие по клику на оверлей
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function renderZoneTable() {
  const wrap = document.getElementById('zoneTableWrap');
  const filter = (document.getElementById('zoneSearch').value || '').toLowerCase();
  wrap.innerHTML = '';

  GROUPS.forEach(group => {
    const groupZones = zones.filter(z =>
      z.group === group.key &&
      (filter === '' || z.name.toLowerCase().includes(filter))
    );

    if (groupZones.length === 0) return;

    // Заголовок группы
    const header = document.createElement('div');
    header.className = 'zone-group-header ' + group.css;
    header.textContent = group.name;
    wrap.appendChild(header);

    // Зоны группы
    groupZones.forEach(zone => {
      const row = document.createElement('div');
      row.className = 'zone-row';
      row.innerHTML = `
        <span class="zone-name">${zone.name}</span>
        <input type="number" class="zone-price-input" data-zone-id="${zone.id}"
               value="${zone.price}" min="0" step="50">
      `;
      wrap.appendChild(row);
    });
  });
}

function filterZones() {
  renderZoneTable();
}

function savePrices() {
  // Считываем все значения из инпутов
  const inputs = document.querySelectorAll('.zone-price-input');
  inputs.forEach(input => {
    const id = input.dataset.zoneId;
    const val = parseInt(input.value) || 0;
    const zone = zones.find(z => z.id === id);
    if (zone) zone.price = val;
  });
  savePricesToStorage();
  // Анимация подтверждения
  const btn = event.target;
  const origText = btn.textContent;
  btn.textContent = '✅ Сохранено!';
  btn.style.background = '#27ae60';
  setTimeout(() => {
    btn.textContent = origText;
    btn.style.background = '';
  }, 1500);
}

function resetPrices() {
  // Сбрасываем все зоны на 1000₽
  zones.forEach(z => { z.price = DEFAULT_PRICE; });
  savePricesToStorage();
  renderZoneTable();
  // Анимация подтверждения
  const btn = event.target;
  const origText = btn.textContent;
  btn.textContent = '✅ Сброшено!';
  setTimeout(() => { btn.textContent = origText; }, 1500);
}

// Обработка Enter при вводе адреса
addressInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    autocompleteList.style.display = 'none';
    calculate();
  }
});
</script>
