<html lang="ru">

<style>
/* === ОСНОВНЫЕ СТИЛИ === */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f8f9fa;
  color: #2c3e50;
  min-height: 100vh;
}
.container {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px;
}
h1 {
  text-align: center;
  font-size: 1.5rem;
  color: #2c3e50;
  margin-bottom: 24px;
  padding-top: 12px;
}

/* === ФОРМА === */
.form-group {
  margin-bottom: 16px;
  position: relative;
}
label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  font-size: 0.9rem;
  color: #2c3e50;
}
input[type="text"],
input[type="number"],
select {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 1rem;
  transition: border-color 0.3s;
  background: #fff;
  color: #2c3e50;
}
input:focus, select:focus {
  outline: none;
  border-color: #ff4747;
}

/* === АВТОПОДСКАЗКИ === */
.autocomplete-list {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #fff;
  border: 2px solid #ddd;
  border-top: none;
  border-radius: 0 0 10px 10px;
  max-height: 220px;
  overflow-y: auto;
  z-index: 100;
  display: none;
}
.autocomplete-item {
  padding: 10px 14px;
  cursor: pointer;
  font-size: 0.9rem;
  border-bottom: 1px solid #f0f0f0;
  transition: background 0.15s;
}
.autocomplete-item:hover {
  background: #fff0f0;
}
.autocomplete-item:last-child { border-bottom: none; }

/* === КНОПКИ === */
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  margin-bottom: 10px;
  text-decoration: none;
  display: inline-block;
  text-align: center;
}
.btn:active { transform: scale(0.97); }
.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}
.btn-primary {
  background: #ff4747;
  color: #fff;
  box-shadow: 0 4px 14px rgba(255, 71, 71, 0.35);
}
.btn-primary:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(255, 71, 71, 0.5); }
.btn-secondary {
  background: #2c3e50;
  color: #fff;
}
.btn-outline {
  background: transparent;
  color: #2c3e50;
  border: 2px solid #ddd;
}
.btn-outline:hover:not(:disabled) { border-color: #2c3e50; }
.btn-success {
  background: #27ae60;
  color: #fff;
}
.btn-sm {
  padding: 10px 16px;
  font-size: 0.85rem;
  width: auto;
}
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 6px;
}
.btn-row .btn { flex: 1; }

/* === КАРТОЧКА РЕЗУЛЬТАТА === */
.result-card {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  margin-top: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.1);
  animation: slideUp 0.4s ease;
  display: none;
}
.result-card.show { display: block; }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.result-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 0.95rem;
  border-bottom: 1px solid #f0f0f0;
}
.result-row:last-child { border-bottom: none; }
.result-row.total {
  font-size: 1.2rem;
  font-weight: 700;
  color: #ff4747;
  border-top: 2px solid #ff4747;
  margin-top: 6px;
  padding-top: 12px;
}
.result-label { color: #666; }

/* === МОДАЛЬНОЕ ОКНО === */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
  overflow-y: auto;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  width: 100%;
  max-width: 560px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  margin-top: 30px;
}
.modal h2 {
  font-size: 1.2rem;
  margin-bottom: 14px;
  text-align: center;
}
.modal-search {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 0.9rem;
  margin-bottom: 10px;
}
.modal-search:focus { outline: none; border-color: #ff4747; }

/* === СТАТУС ЗАГРУЗКИ === */
.sync-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: #f8f9fa;
  border-radius: 10px;
  margin-bottom: 14px;
  font-size: 0.85rem;
}
.sync-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
}
.sync-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #27ae60;
}
.sync-dot.cache { background: #f39c12; }
.sync-dot.error { background: #e74c3c; }
.sync-dot.loading { background: #3498db; animation: pulse 1s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.sync-date {
  color: #999;
  font-size: 0.8rem;
}

/* === ИНФОРМАЦИЯ === */
.info-box {
  background: #e8f4fd;
  border: 1px solid #bee5eb;
  color: #0c5460;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 14px;
  font-size: 0.85rem;
  line-height: 1.4;
}

.modal-table-wrap {

  overflow-y: auto;
  margin-bottom: 14px;
  border: 1px solid #eee;
  border-radius: 10px;
}
.zone-group-header {
  padding: 8px 12px;
  font-weight: 700;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  position: sticky;

.group-poselki { background: #eceff1; color: #607d8b; }

.spinner {

.error-msg {

<div class="container">
  <!-- Заголовок -->

    <div class="autocomplete-list" id="autocompleteList"></div>
  </div>

  <!-- Тип подъёма -->
  <div class="form-group">
    <label for="liftType">🛗 Тип подъёма</label>
    <select id="liftType">
      <option value="lift">Лифт</option>
      <option value="nolift">Без лифта</option>
      <option value="owner">С хозяином</option>
    </select>
  </div>

  <!-- Этаж -->
  <div class="form-group">
    <label for="floorInput">🏢 Этаж</label>
    <input type="number" id="floorInput" min="1" max="50" value="1">
  </div>

  <!-- Кнопки -->
  <button class="btn btn-primary" id="calcBtn" onclick="calculate()">Рассчитать</button>

  <!-- Загрузка -->
  <div class="spinner" id="spinner">⏳ Определяем адрес...</div>

  <!-- Ошибка -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Карточка результата -->
  <div class="result-card" id="resultCard">
    <div class="result-row">
      <span class="result-label">📍 Адрес:</span>
      <span id="resAddress" style="text-align:right;max-width:60%;font-weight:600;"></span>
    </div>
    <div class="result-row">
      <span class="result-label">📍 Район:</span>
      <span id="resZone" style="font-weight:600;"></span>
    </div>
    <div class="result-row">
      <span class="result-label">🚚 Доставка:</span>
      <span id="resDelivery" style="font-weight:600;"></span>
    </div>
    <div class="result-row">
      <span class="result-label">🛗 Подъём:</span>
      <span id="resLift" style="font-weight:600;"></span>
    </div>
    <div class="result-row total">
      <span>💰 ИТОГО:</span>
      <span id="resTotal"></span>
    </div>
  </div>

  <!-- Кнопки снизу -->
  <div class="btn-row" style="margin-top:16px;">
    <button class="btn btn-outline" onclick="resetAll()">Сброс</button>
    <button class="btn btn-secondary" onclick="openModal()">⚙️ Просмотр цен</button>
  </div>
</div>

// ============================================================
// ИНИЦИАЛИЗАЦИЯ: загрузка цен
// ============================================================
let zones = ZONES_DATA.map(z => ({
  ...z,
  price: DEFAULT_PRICE
}));

// Состояние загрузки
let loadStatus = 'loading'; // 'loaded', 'cache', 'error'
let lastLoadTime = null;

// ============================================================
// РАБОТА С КЭШЕМ localStorage
// ============================================================
function loadCachedPrices() {
  const saved = localStorage.getItem('krd_delivery_prices_csv');
  const savedTime = localStorage.getItem('krd_delivery_prices_csv_time');
  if (saved) {
    try {
      const prices = JSON.parse(saved);
      zones.forEach(z => {
        if (prices[z.name] !== undefined) {
          z.price = Number(prices[z.name]);
        }
      });
      if (savedTime) {
        lastLoadTime = new Date(savedTime);
      }
      return true;
    } catch(e) {
      console.warn('Ошибка загрузки кэша цен:', e);
    }
  }
  return false;
}

function saveCachedPrices() {
  const prices = {};
  zones.forEach(z => { prices[z.name] = z.price; });
  localStorage.setItem('krd_delivery_prices_csv', JSON.stringify(prices));
  localStorage.setItem('krd_delivery_prices_csv_time', new Date().toISOString());
}

// ============================================================
// ЗАГРУЗКА ЦЕН ИЗ CSV
// ============================================================
function parseCSV(csvText) {
  // Парсим CSV: колонка A — район, колонка B — цена
  // Первая строка — заголовок (пропускаем)
  const lines = csvText.split('\n');
  const prices = {};
  
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    
    // Разбиваем по запятой, учитывая что название может содержать запятую в кавычках
    let columns;
    if (line.includes('"')) {
      // Сложный парсинг с кавычками
      columns = [];
      let current = '';
      let inQuotes = false;
      for (const char of line) {
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          columns.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      columns.push(current.trim());
    } else {
      columns = line.split(',');
    }
    
    if (columns.length >= 2) {
      const zoneName = columns[0].trim().replace(/^"|"$/g, '');
      const price = parseInt(columns[1].trim().replace(/[^\d]/g, '')) || DEFAULT_PRICE;
      if (zoneName) {
        prices[zoneName] = price;
      }
    }
  }
  
  return prices;
}

async function loadPricesFromCSV() {
  updateLoadStatus('loading');
  
  try {
    // Создаём контроллер для таймаута
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), LOAD_TIMEOUT);
    
    const response = await fetch(CSV_URL, { signal: controller.signal });
    clearTimeout(timeoutId);
    
    if (!response.ok) {
      throw new Error('HTTP_ERROR');
    }
    
    const csvText = await response.text();
    const prices = parseCSV(csvText);
    
    // Применяем цены к зонам
    let found = 0;
    zones.forEach(z => {
      if (prices[z.name] !== undefined) {
        z.price = prices[z.name];
        found++;
      }
    });
    
    console.log(`Загружено ${found} цен из таблицы`);
    
    // Сохраняем в кэш
    saveCachedPrices();
    lastLoadTime = new Date();
    
    updateLoadStatus('loaded');
    renderZoneTable();
    
    return true;
  } catch(e) {
    console.error('Ошибка загрузки CSV:', e);
    
    // Пытаемся загрузить из кэша
    if (loadCachedPrices()) {
      updateLoadStatus('cache');
    } else {
      updateLoadStatus('error');
    }
    
    renderZoneTable();
    return false;
  }
}

// ============================================================
function updateLoadStatus(status) {
  loadStatus = status;
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  const dateEl = document.getElementById('syncDate');
  
  if (!dot) return; // Модальное окно ещё не открыто
  
  dot.className = 'sync-dot';
  
  switch(status) {
    case 'loaded':
      text.textContent = '🟢 Загружено из таблицы';
      break;
    case 'loading':
      dot.classList.add('loading');
      text.textContent = '⏳ Загрузка...';
      break;
    case 'cache':
      dot.classList.add('cache');
      text.textContent = '🟡 Загружено из кэша';
      break;
    case 'error':
      dot.classList.add('error');
      text.textContent = '🔴 Ошибка загрузки';
      break;
  }
  
  // Обновляем дату последней загрузки
  if (lastLoadTime) {
    const timeStr = lastLoadTime.toLocaleString('ru-RU', {
      day: '2-digit',
      month: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    });
    dateEl.textContent = `Обновлено: ${timeStr}`;
  } else {
    dateEl.textContent = '';
  }
}

// ============================================================
// АЛГОРИТМ RAY CASTING — проверка точки в полигоне
// ============================================================
function pointInPolygon(lat, lng, polygon) {
  let inside = false;
  const n = polygon.length;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const yi = polygon[i][0], xi = polygon[i][1];
    const yj = polygon[j][0], xj = polygon[j][1];
    if (((yi > lat) !== (yj > lat)) &&
        (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

// Определение зоны по координатам
function findZone(lat, lng) {
  for (const zone of zones) {
    if (pointInPolygon(lat, lng, zone.coords)) {
      return zone;
    }
  }
  return null;
}

// ============================================================
// ЯНДЕКС.ГЕОКОДЕР API: геокодирование и автоподсказки
// ============================================================
const YANDEX_API_KEY = '78878ee3-2be9-4cfd-b99d-8b9e78b387f1';
const YANDEX_GEOCODER_URL = 'https://geocode-maps.yandex.ru/1.x/';
const GEOCODE_TIMEOUT = 5000;
const DEBOUNCE_DELAY = 500;

let debounceTimer = null;
let selectedLat = null;
let selectedLng = null;
let selectedDisplayName = '';

const addressInput = document.getElementById('addressInput');
const autocompleteList = document.getElementById('autocompleteList');

// Функция fetch с таймаутом для геокодера
async function fetchWithTimeout(url, timeout = GEOCODE_TIMEOUT) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeout);
  
  try {
    const response = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    return response;
  } catch (error) {
    clearTimeout(timeoutId);
    if (error.name === 'AbortError') {
      throw new Error('TIMEOUT');
    }
    throw error;
  }
}

// Функция для создания URL запроса к Яндекс.Геокодеру
function buildYandexUrl(query, results = 5) {
  const params = new URLSearchParams({
    apikey: YANDEX_API_KEY,
    geocode: query,
    format: 'json',
    results: results,
    lang: 'ru_RU'
  });
  return `${YANDEX_GEOCODER_URL}?${params.toString()}`;
}

// Парсинг ответа Яндекс.Геокодера
function parseYandexResponse(data) {
  const results = [];
  try {
    const featureMembers = data.response.GeoObjectCollection.featureMember;
    if (!featureMembers || featureMembers.length === 0) {
      return results;
    }
    featureMembers.forEach(item => {
      const geoObject = item.GeoObject;
      const text = geoObject.metaDataProperty.GeocoderMetaData.text;
      // Координаты в формате "lon lat" — разделяем и меняем местами
      const pos = geoObject.Point.pos.split(' ');
      const lon = parseFloat(pos[0]);
      const lat = parseFloat(pos[1]);
      results.push({ text, lat, lon });
    });
  } catch (e) {
    console.error('Ошибка парсинга ответа Яндекса:', e);
  }
  return results;
}

// Автоподсказки при вводе адреса
addressInput.addEventListener('input', function() {
  selectedLat = null;
  selectedLng = null;
  const query = this.value.trim();
  if (query.length < 3) {
    autocompleteList.style.display = 'none';
    return;
  }
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => fetchSuggestions(query), DEBOUNCE_DELAY);
});

// Скрытие подсказок при клике вне
document.addEventListener('click', function(e) {
  if (!addressInput.contains(e.target) && !autocompleteList.contains(e.target)) {
    autocompleteList.style.display = 'none';
  }
});

async function fetchSuggestions(query) {
  const fullQuery = 'Краснодар, ' + query;
  const url = buildYandexUrl(fullQuery, 5);

  try {
    const resp = await fetchWithTimeout(url);
    
    if (!resp.ok) {
      throw new Error('HTTP_ERROR');
    }
    
    const data = await resp.json();
    const results = parseYandexResponse(data);
    showSuggestions(results);
  } catch(e) {
    console.error('Ошибка запроса к Яндекс.Геокодеру:', e);
    autocompleteList.style.display = 'none';
  }
}

function showSuggestions(results) {
  autocompleteList.innerHTML = '';
  if (!results || results.length === 0) {
    autocompleteList.style.display = 'none';
    return;
  }
  results.forEach(r => {
    const item = document.createElement('div');
    item.className = 'autocomplete-item';
    item.textContent = r.text;
    item.addEventListener('click', () => {
      addressInput.value = r.text;
      selectedLat = r.lat;
      selectedLng = r.lon;
      selectedDisplayName = r.text;
      autocompleteList.style.display = 'none';
    });
    autocompleteList.appendChild(item);
  });
  autocompleteList.style.display = 'block';
}

// ============================================================
// РАСЧЁТ СТОИМОСТИ ПОДЪЁМА
// ============================================================
function calcLiftPrice(type, floor) {
  floor = Math.max(1, Math.min(50, floor));
  if (type === 'lift') {
    // Лифт: 600₽ на любой этаж
    return 600;
  } else if (type === 'nolift') {
    // Без лифта: 1 эт = 600, 2 эт = 1200, 3+ = 1200 + 250 × (этаж − 2)
    if (floor === 1) return 600;
    if (floor === 2) return 1200;
    return 1200 + 250 * (floor - 2);
  } else if (type === 'owner') {
    // С хозяином: 1 эт = 600, 2+ = 600 + 175 × (этаж − 1)
    if (floor === 1) return 600;
    return 600 + 175 * (floor - 1);
  }
  return 0;
}

// ============================================================
// ОСНОВНОЙ РАСЧЁТ
// ============================================================
async function calculate() {
  const errorMsg = document.getElementById('errorMsg');
  const spinner = document.getElementById('spinner');
  const resultCard = document.getElementById('resultCard');

  errorMsg.classList.remove('show');
  errorMsg.textContent = '';
  resultCard.classList.remove('show');

  const query = addressInput.value.trim();
  if (!query) {
    showError('Введите адрес для расчёта');
    return;
  }

  let lat = selectedLat;
  let lng = selectedLng;

  // Если координаты не выбраны из подсказок, делаем геокодирование
  if (lat === null || lng === null) {
    spinner.classList.add('show');
    try {
      const fullQuery = query.toLowerCase().includes('краснод') 
        ? query 
        : 'Краснодар, ' + query;
      const url = buildYandexUrl(fullQuery, 1);
      
      const resp = await fetchWithTimeout(url);
      
      if (!resp.ok) {
        throw new Error('HTTP_ERROR');
      }
      
      const data = await resp.json();
      const results = parseYandexResponse(data);
      spinner.classList.remove('show');

      if (!results || results.length === 0) {
        showError('Адрес не найден. Попробуйте уточнить.');
        return;
      }
      
      lat = results[0].lat;
      lng = results[0].lon;
      selectedDisplayName = results[0].text;
    } catch(e) {
      spinner.classList.remove('show');
      if (e.message === 'TIMEOUT') {
        showError('Сервис временно недоступен. Попробуйте позже.');
      } else if (e.name === 'TypeError' || e.message === 'Failed to fetch') {
        showError('Проверьте интернет-соединение.');
      } else {
        showError('Сервис временно недоступен. Попробуйте позже.');
      }
      console.error('Ошибка геокодирования:', e);
      return;
    }
  }

  spinner.classList.remove('show');

  // Определяем зону по координатам
  const zone = findZone(lat, lng);
  if (!zone) {
    showError(`Координаты (${lat.toFixed(4)}, ${lng.toFixed(4)}) не попали ни в одну зону доставки.`);
    return;
  }

  // Расчёт подъёма
  const liftType = document.getElementById('liftType').value;
  const floor = parseInt(document.getElementById('floorInput').value) || 1;
  const deliveryPrice = zone.price;
  const liftPrice = calcLiftPrice(liftType, floor);
  const total = deliveryPrice + liftPrice;

  // Отображение результата
  const shortAddr = selectedDisplayName || query;
  document.getElementById('resAddress').textContent = shortAddr.length > 60
    ? shortAddr.substring(0, 57) + '...'
    : shortAddr;
  document.getElementById('resZone').textContent = zone.name;
  document.getElementById('resDelivery').textContent = deliveryPrice + '₽';
  document.getElementById('resLift').textContent = liftPrice + '₽';
  document.getElementById('resTotal').textContent = total + '₽';

  resultCard.classList.add('show');
}

function showError(msg) {
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = msg;
  errorMsg.classList.add('show');
}

// ============================================================
// СБРОС
// ============================================================
function resetAll() {
  addressInput.value = '';
  document.getElementById('liftType').value = 'lift';
  document.getElementById('floorInput').value = 1;
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('spinner').classList.remove('show');
  autocompleteList.style.display = 'none';
  selectedLat = null;
  selectedLng = null;
  selectedDisplayName = '';
}

// МОДАЛЬНОЕ ОКНО ПРОСМОТРА ЦЕН
// ============================================================
function openModal() {
  renderZoneTable();
  updateLoadStatus(loadStatus);
  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

// Закрытие по клику на оверлей
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function renderZoneTable() {
  const wrap = document.getElementById('zoneTableWrap');
  const filter = (document.getElementById('zoneSearch').value || '').toLowerCase();
  wrap.innerHTML = '';

  GROUPS.forEach(group => {
    const groupZones = zones.filter(z =>
      z.group === group.key &&
      (filter === '' || z.name.toLowerCase().includes(filter))
    );

    if (groupZones.length === 0) return;

    // Заголовок группы
    const header = document.createElement('div');
    header.className = 'zone-group-header ' + group.css;
    header.textContent = group.name;
    wrap.appendChild(header);

    // Зоны группы (только просмотр)
    groupZones.forEach(zone => {
      const row = document.createElement('div');
      row.className = 'zone-row';
      row.innerHTML = `
        <span class="zone-name">${zone.name}</span>
        <span class="zone-price">${zone.price}₽</span>
      `;
      wrap.appendChild(row);
    });
  });
}

function filterZones() {
  renderZoneTable();
}

addressInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    autocompleteList.style.display = 'none';
    calculate();
  }
});
